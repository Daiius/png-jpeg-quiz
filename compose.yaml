# 開発環境（prd/02 §6）。MySQL はホストにポートを出さず compose 網内だけで使う。
# 起動: pnpm dev（= docker compose watch）
#
# ローカル dev とリモート dev 公開（前段プロキシ越しに手元ブラウザから使う）で compose を分けない。
# 単一の compose.yaml を環境変数でパラメータ化し、remote 差分は .env.remote に集約する
# （.env.remote.example 参照。pnpm dev:remote = docker compose --env-file .env --env-file .env.remote watch）。
# prd/02 §6.2。
#
#   | 差分            | ローカル既定       | remote（.env.remote）           |
#   |-----------------|--------------------|---------------------------------|
#   | web の公開バインド | 0.0.0.0:3000（全 IF） | 127.0.0.1 の 1 ポート（WEB_BIND） |
#   | 公開オリジン      | http://localhost:3000 | PUBLIC_ORIGIN=https://<host>   |
name: png-jpeg-quiz

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-png_jpeg_quiz}
      MYSQL_USER: ${MYSQL_USER:-quiz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # named volume だけを使う（bind mount は使わない）
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 初期化に十数秒かかる。web はこれが通るまで待つ
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-quiz}:${MYSQL_PASSWORD:?set it in .env}@db:3306/${MYSQL_DATABASE:-png_jpeg_quiz}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ASSET_BASE_URL: ${ASSET_BASE_URL:-http://localhost:3000/assets}
    ports:
      # ホストに出すのは web だけ（db は compose 網内のみ）。
      # WEB_BIND でバインドアドレスを絞れる。remote 公開時は 127.0.0.1 にして、
      # 前段プロキシからしか届かない唯一の外向きの口にする（§6.2）。
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000'
    volumes:
      # pnpm quiz:build の成果物（M4 までは web がここから配信する）。
      # bind mount ではなく named volume にして、ホスト側のファイル権限に依存させない
      - build-data:/app/build
      # 素材は「入力データ」。イメージには焼かず（.dockerignore 済み）読み取り専用で見せる
      - ./assets:/app/assets:ro
    develop:
      watch:
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - .next/
            # マニフェストは下の rebuild が拾う（sync だけだと node_modules と食い違う）
            - '*/package.json'
        # 依存・スクリプトが変わったらイメージを作り直す。
        # ⚠ watch の path に glob は使えないので、マニフェストは 1 つずつ挙げる
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./packages/quiz-core/package.json
        - action: rebuild
          path: ./packages/database/package.json
        - action: rebuild
          path: ./packages/pipeline/package.json
        - action: rebuild
          path: ./packages/web/package.json

volumes:
  db-data:
  build-data:
